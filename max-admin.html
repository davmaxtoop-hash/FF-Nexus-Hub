<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAX SHOP Admin</title>
<style>
body{font-family:Arial;margin:0;background:#101828;color:#fff}.wrap{max-width:520px;margin:auto;padding:30px 20px}.card{background:#fff;color:#111;padding:25px;border-radius:18px}.row{margin:14px 0}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}.btn{margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700}
</style></head><body><div class="wrap"><h1>MAX SHOP ADMIN</h1><div class="card">
<div class="row"><label>Admin password</label><input id="pw" type="password" autocomplete="current-password"></div>
<button class="btn" onclick="login()">Sign in</button><p id="msg"></p>
</div></div><script>
async function login(){
 const password=document.getElementById('pw').value;
 try{
  const r=await fetch('/api/max-shop/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
  const d=await r.json(); document.getElementById('msg').textContent=d.message|| (r.ok?'Login successful':'Login failed');
 }catch(e){document.getElementById('msg').textContent='Admin service unavailable';}
}
</script></body></html>
